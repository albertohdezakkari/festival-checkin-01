service: festival-check-in-ts
frameworkVersion: "4.45.0"

provider:
  name: aws
  runtime: nodejs22.x
  region: ${env:AWS_REGION}
  stage: ${env:FCI_EQUIPO}
  iam:
    role: ${env:LAMBDA_ROLE_ARN}
  environment:
    FCI_TABLA_EVENTOS:
      Ref: FestivalCheckInEventos
    FCI_TABLA_INSCRIPCIONES:
      Ref: FestivalCheckInInscripciones
    FCI_TABLA_USUARIOS:
      Ref: FestivalCheckInUsuarios
  httpApi:
    payload: '2.0'
    cors:
      allowedOrigins:
        - https://albertohdezakkari.github.io
      allowedHeaders:
        - Content-Type
      allowedMethods:
        - GET
        - POST

build:
  esbuild: false

package:
  patterns:
    - "!src/**"
    - "!tsconfig.json"
    - "!scripts/**"
    - "!README.md"
    - "!.env*"

functions:
  crearEvento:
    name: ${self:service}-${self:provider.stage}-crearEvento
    handler: dist/eventos/crear-evento/handler.handler
  listarEventos:
    name: ${self:service}-${self:provider.stage}-listarEventos
    handler: dist/eventos/listar-eventos/handler.listarEventosHandler
  crearUsuario:
    name: ${self:service}-${self:provider.stage}-crearUsuario
    handler: dist/usuarios/crear-usuario/handler.handler
  consultarInscripcion:
    handler: dist/inscripciones/consultar-inscripcion/handler.handler
    events:
      - httpApi:
          method: GET
          path: /events/{eventId}/registrations/{userId}
  inscribirUsuario:
    handler: dist/inscripciones/inscribir-usuario/handler.handler
    events:
      - httpApi:
          method: POST
          path: /events/{eventId}/registrations/{userId}

resources:
  Resources:
    FestivalCheckInEventos:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: FCI_TS_EVENTOS_${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: EVENT_ID
            AttributeType: N
        KeySchema:
          - AttributeName: EVENT_ID
            KeyType: HASH
    FestivalCheckInInscripciones:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: FCI_TS_INSCRIPCIONES_${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: EVENT_ID
            AttributeType: N
          - AttributeName: USER_ID
            AttributeType: S
        KeySchema:
          - AttributeName: EVENT_ID
            KeyType: HASH
          - AttributeName: USER_ID
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: PorUsuario
            KeySchema:
              - AttributeName: USER_ID
                KeyType: HASH
              - AttributeName: EVENT_ID
                KeyType: RANGE
            Projection:
              ProjectionType: KEYS_ONLY
    FestivalCheckInUsuarios:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: FCI_TS_USUARIOS_${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: USER_ID
            AttributeType: S
        KeySchema:
          - AttributeName: USER_ID
            KeyType: HASH
  Outputs:
    NombreTablaEventosFCI:
      Value:
        Ref: FestivalCheckInEventos
    NombreTablaInscripcionesFCI:
      Value:
        Ref: FestivalCheckInInscripciones
    NombreTablaUsuariosFCI:
      Value:
        Ref: FestivalCheckInUsuarios
